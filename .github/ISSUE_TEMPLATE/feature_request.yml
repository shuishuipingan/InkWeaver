name: Feature request
description: 提议一个能改善长篇小说创作体验的功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述作者场景和可验证结果，不需要上传小说正文。
  - type: input
    id: version
    attributes:
      label: 当前版本
      description: 如果请求针对特定版本，请填写版本号；否则填写 latest。
      placeholder: 1.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - All platforms
        - Windows x64
        - macOS arm64
        - macOS x64
        - DSH plugin
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 作者遇到的痛点
      description: 你正在进行什么创作任务？当前哪里不顺？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述入口、输入、结果和失败恢复，不要只写“增加 AI”。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 用 1–3 条结果描述什么情况算完成。
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 这个请求不要求默认上传私人原稿或隐藏遥测。
          required: true
