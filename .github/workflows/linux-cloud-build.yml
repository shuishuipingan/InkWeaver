name: Linux x64 cloud package qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full immutable commit SHA to qualify
        required: true
        type: string
      release_tag:
        description: Intended tag; qualification does not create it
        required: true
        type: string
      release_version:
        description: Frozen application version
        required: true
        type: string
      profile_path:
        description: Repository-relative frozen release profile
        required: true
        default: .release/release-profile.json
        type: string

permissions:
  contents: read

concurrency:
  group: linux-x64-desktop-qualification
  cancel-in-progress: false

jobs:
  package-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize Linux x64 v2 acceptance evidence
        env:
          AI_NOVEL_RELEASE_EVIDENCE_COMMAND_TIMEOUT_MS: '3600000'
        run: |
          set -euo pipefail
          expected_sha="$(node --input-type=commonjs -e "const e=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(e.inputs.expected_sha)")"
          release_tag="$(node --input-type=commonjs -e "const e=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(e.inputs.release_tag)")"
          release_version="$(node --input-type=commonjs -e "const e=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(e.inputs.release_version)")"
          profile_path="$(node --input-type=commonjs -e "const e=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(e.inputs.profile_path)")"
          dispatch_inputs="$(node --input-type=commonjs -e "const e=JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));const i=e.inputs;process.stdout.write(JSON.stringify({expected_sha:i.expected_sha,release_tag:i.release_tag,release_version:i.release_version,profile_path:i.profile_path}))")"
          test "$expected_sha" = "$(git rev-parse HEAD)"
          test "$release_tag" = "v$release_version"
          test "$profile_path" = '.release/release-profile.json'
          git ls-files --error-unmatch -- "$profile_path" >/dev/null
          evidence_root="$RUNNER_TEMP/ai-novel-release-evidence-$GITHUB_RUN_ID"
          common_root="$GITHUB_WORKSPACE/.release-qualified/linux-x64"
          legacy_release_root="$RUNNER_TEMP/linux-x64-legacy-release"
          node scripts/release-evidence-v2.mjs init --platform linux-x64 --evidence-root "$evidence_root" --repository "$GITHUB_REPOSITORY" --commit "$expected_sha" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-label 'ubuntu-24.04' --image-os "$ImageOS" --image-version "$ImageVersion" --expected-node-version 22.23.1 --expected-pnpm-version 11.11.0 --workflow-path '.github/workflows/linux-cloud-build.yml' --workflow-name 'Linux x64 cloud package qualification' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME" --dispatch-inputs-json "$dispatch_inputs"
          node .release/scripts/freeze-release-contract.mjs --repository "$GITHUB_REPOSITORY" --expected-sha "$expected_sha" --tag "$release_tag" --version "$release_version" --profile "$profile_path" --output-root "$common_root" --platform linux-x64 --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow '.github/workflows/linux-cloud-build.yml' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME"
          echo "AI_NOVEL_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "AI_NOVEL_RELEASE_PROFILE=$profile_path" >> "$GITHUB_ENV"
          echo "AI_NOVEL_EXPECTED_SHA=$expected_sha" >> "$GITHUB_ENV"
          echo "AI_NOVEL_RELEASE_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
          echo "AI_NOVEL_COMMON_EVIDENCE_ROOT=$common_root" >> "$GITHUB_ENV"
          echo "AI_NOVEL_LEGACY_RELEASE_ROOT=$legacy_release_root" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-locked-dependencies -- pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-playwright-chromium -- pnpm exec playwright install --with-deps chromium

      - name: Run renderer browser tests
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step renderer-browser-tests -- pnpm run test:browser

      - name: Run full test suite
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step test-suite -- pnpm test

      - name: Build Linux x64 packages in pinned Ubuntu 22.04 container
        env:
          AI_NOVEL_RELEASE_EVIDENCE_COMMAND_TIMEOUT_MS: '3600000'
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step build-linux-x64-package -- bash scripts/build-linux-package-container.sh

      - name: Install and launch packages on Ubuntu, Debian, and Fedora
        env:
          AI_NOVEL_RELEASE_EVIDENCE_COMMAND_TIMEOUT_MS: '3600000'
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step linux-package-smoke -- node scripts/smoke-linux-packages.mjs --release-root "release/$AI_NOVEL_RELEASE_VERSION" --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --version "$AI_NOVEL_RELEASE_VERSION"

      - name: Record verified host toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'x86_64'
          test "$(pnpm --version)" = '11.11.0'
          test "$(node --version | sed 's/^v//')" = '22.23.1'
          echo "AI_NOVEL_CLOUD_BUILD_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"

      - name: Finalize and verify Linux x64 evidence bundle
        run: |
          set -euo pipefail
          version="$AI_NOVEL_RELEASE_VERSION"
          node scripts/release-evidence-v2.mjs finalize --platform linux-x64 --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --release-root "release/$version"
          node .release/scripts/project-legacy-qualification.mjs --platform linux-x64 --version "$version" --source-root "release/$version" --output-root "$AI_NOVEL_LEGACY_RELEASE_ROOT" --profile "$AI_NOVEL_RELEASE_PROFILE"
          raw_hash="$(node --input-type=module -e "import{createHash}from'node:crypto';import{readFileSync}from'node:fs';process.stdout.write(createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex'))")"
          canonical_hash="$(node --input-type=module -e "import{canonicalPnpmLockfileSha256}from'./scripts/canonical-pnpm-lockfile-hash.mjs';process.stdout.write(canonicalPnpmLockfileSha256('./pnpm-lock.yaml'))")"
          node scripts/release-evidence-v2.mjs verify-bundle --platform linux-x64 --bundle-root "$AI_NOVEL_LEGACY_RELEASE_ROOT" --expected-commit "$AI_NOVEL_EXPECTED_SHA" --expected-lockfile-sha256 "$canonical_hash" --expected-lockfile-raw-sha256 "$raw_hash" --version "$version" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --expected-workflow-path '.github/workflows/linux-cloud-build.yml' --expected-workflow-name 'Linux x64 cloud package qualification' --expected-actor "$GITHUB_ACTOR" --expected-event "$GITHUB_EVENT_NAME"
          node .release/scripts/finalize-legacy-qualification.mjs --platform linux-x64 --legacy-root "$AI_NOVEL_LEGACY_RELEASE_ROOT" --output-root "$AI_NOVEL_COMMON_EVIDENCE_ROOT" --profile "$AI_NOVEL_RELEASE_PROFILE" --expected-sha "$AI_NOVEL_EXPECTED_SHA" --version "$version"

      - name: Upload runtime-verified Linux x64 packages
        id: upload-qualified
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-linux-x64
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: .release-qualified/linux-x64
