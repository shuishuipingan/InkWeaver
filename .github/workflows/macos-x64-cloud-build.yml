name: macOS Intel isolated performance diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full immutable commit SHA to qualify
        required: true
        type: string
      release_tag:
        description: Intended tag; qualification does not create it
        required: true
        type: string
      release_version:
        description: Frozen application version
        required: true
        type: string
      profile_path:
        description: Repository-relative frozen release profile
        required: true
        default: .release/release-profile.json
        type: string

permissions:
  contents: read

concurrency:
  group: macos-x64-cloud-build-${{ inputs.expected_sha }}-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  package-and-qualify:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize macOS x64 v2 acceptance evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$PROFILE_PATH" = '.release/release-profile.json'
          git ls-files --error-unmatch -- "$PROFILE_PATH" >/dev/null
          evidence_root="$RUNNER_TEMP/ai-novel-release-evidence-$GITHUB_RUN_ID"
          node scripts/release-evidence-v2.mjs init --platform macos-x64 --evidence-root "$evidence_root" --repository "$GITHUB_REPOSITORY" --commit "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-label 'macos-15-intel' --image-os "$ImageOS" --image-version "$ImageVersion" --expected-node-version 22.23.1 --expected-pnpm-version 11.11.0 --workflow-path '.github/workflows/macos-x64-cloud-build.yml' --workflow-name 'macOS Intel x64 cloud package qualification' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME" --dispatch-inputs-json '{}'
          common_root="$RUNNER_TEMP/macos-x64-qualified"
          legacy_release_root="$RUNNER_TEMP/macos-x64-legacy-release"
          node .release/scripts/freeze-release-contract.mjs --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_SHA" --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --profile "$PROFILE_PATH" --output-root "$common_root" --platform macos-x64 --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow '.github/workflows/macos-x64-cloud-build.yml' --actor "$GITHUB_ACTOR" --event "$GITHUB_EVENT_NAME"
          echo "AI_NOVEL_RELEASE_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
          echo "AI_NOVEL_COMMON_EVIDENCE_ROOT=$common_root" >> "$GITHUB_ENV"
          echo "AI_NOVEL_LEGACY_RELEASE_ROOT=$legacy_release_root" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-locked-dependencies -- pnpm install --frozen-lockfile

      - name: Verify Intel LanceDB native binding
        run: |
          node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step verify-lancedb-darwin-x64-binding -- env NAPI_RS_ENFORCE_VERSION_CHECK=1 node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') throw new Error('Expected an Intel macOS runner'); const fs = require('node:fs'); const path = require('node:path'); const binding = require('@lancedb/lancedb-darwin-x64'); const lancedb = require('@lancedb/lancedb'); const packageVersion = JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('@lancedb/lancedb')), '..', 'package.json'), 'utf8')).version; const bindingVersion = JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('@lancedb/lancedb-darwin-x64')), 'package.json'), 'utf8')).version; if (packageVersion !== bindingVersion) throw new Error('LanceDB native binding version does not match the JavaScript package'); if (typeof binding.Connection !== 'function' || typeof lancedb.connect !== 'function') throw new Error('LanceDB Intel native binding did not load')"

      - name: Install Playwright Chromium
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step install-playwright-chromium -- pnpm exec playwright install chromium

      - name: Run renderer browser tests
        run: node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step renderer-browser-tests -- pnpm run test:browser -- src/components/editor/__tests__/RelationshipGraph.performance.browser.tsx

      - name: Build native secure helper for macOS tests
        run: |
          node scripts/release-evidence-v2.mjs record --evidence-root "$AI_NOVEL_RELEASE_EVIDENCE_ROOT" --step build-native-secure-helper -- bash -lc 'clang -fobjc-arc -framework Foundation electron/security/darwin-safe-file-system.m -o electron/security/darwin-safe-file-system && chmod +x electron/security/darwin-safe-file-system'
